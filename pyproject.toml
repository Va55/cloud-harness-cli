[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-harness-cli"
version = "0.1.1"
description = "Multi-account, multi-region AWS management CLI. CLI-first, Python/boto3, team-shared."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Team"},
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.36,<2.0",
    "botocore>=1.36,<2.0",
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "jsonschema>=4.23",
    "rich-argparse>=1.0",
]

[project.optional-dependencies]
# The MCP server needs the MCP Python SDK. Pinned below 2.0: this code
# imports mcp.server.fastmcp, which the 2.x line no longer provides.
mcp = ["mcp>=1.2,<2"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "moto>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
harness = "harness_cli.main:main"

[project.entry-points."cloud_harness.plugins"]
iam = "harness_plugins.iam.plugin:IAMPlugin"
ec2 = "harness_plugins.ec2.plugin:EC2Plugin"
s3 = "harness_plugins.s3.plugin:S3Plugin"
cloudfront = "harness_plugins.cloudfront.plugin:CloudFrontPlugin"
lambda = "harness_plugins.aws_lambda.plugin:LambdaPlugin"
org = "harness_plugins.org.plugin:OrgPlugin"
vpc = "harness_plugins.vpc.plugin:VPCPlugin"
backup = "harness_plugins.backup.plugin:BackupPlugin"
cost = "harness_plugins.cost.plugin:CostPlugin"
security = "harness_plugins.security.plugin:SecurityPlugin"
inventory = "harness_plugins.inventory.plugin:InventoryPlugin"

# Non-Python files that must ship: the SQL migrations are read at runtime,
# and without them an installed copy creates an empty database and every
# store-backed command fails with "no such table".
[tool.setuptools.package-data]
harness_store = ["schemas/*.sql"]
harness_config = ["templates/*.yaml", "examples/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness_primitives*", "harness_plugins*", "harness_cli*", "harness_store*", "harness_config*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=harness --cov-report=term-missing -v"
